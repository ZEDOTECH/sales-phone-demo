        (r.isLocked ? '<span class="badge badge-gray">已鎖定</span>' : '') + '</div>' +
        '<div class="detail-lines" style="margin-top:8px;">現金：<span>' + n0(r.cash) + '</span>　支票：<span>' + n0(r.check) + '</span>　暫收：<span>' + n0(r.temp) + '</span>　暫欠：<span>' + n0(r.arrears) + '</span>\n' +
        '業務：<span>' + esc(r.salesCode || '') + '　' + esc(r.salesName || '') + '</span>　製單：<span>' + esc(r.userId || '') + '　' + esc(r.userName || '') + '</span></div>' +
        (images.length ? '<div class="receipt-thumbs" data-lightbox>' + images.map(function (f) { return '<a href="#"><img src="' + esc(f.data) + '" alt="收款單 ' + esc(r.displayNo) + ' 的圖片附件" width="88" height="88"></a>'; }).join('') + '</div>' : '') +
        '<div class="action-row" style="margin-top:9px;"><a class="btn btn-sm btn-info" href="' + esc(href('/receipts/edit', { date: r.date, seq: r.seq })) + '">更正</a>' +
        (r.canDelete ? '<a class="btn btn-sm btn-danger" href="' + esc(href('/receipts/delete', { date: r.date, seq: r.seq })) + '">刪除</a>' : '') + '</div>' +
        (r.isLocked ? '<p class="field-hint" style="margin:8px 0 0;">已產生傳票，可查看但不可儲存變更或刪除。</p>'
          : r.hasSettlements ? '<p class="field-hint" style="margin:8px 0 0;">已有沖帳明細，不可刪除。</p>' : '') + '</div>';
    });
    html += pagerHtml(page, totalPages, function (n) { return href('/receipts', Object.assign({}, q, { page: n })); });
  }
  return {
    title: '收款作業', activeNav: 'receipts', html: html, fileRefs: refs,
    mount: function () {
      var form = document.getElementById('receipt-query');
      mountRocDates(form);
      mountCustomerLookup(form);
      mountSalesDialog(form);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var params = {};
        ['DateFrom', 'DateTo', 'CustomerCode', 'CustomerName', 'UserId', 'SalesCode'].forEach(function (k) { params[k] = form.elements[k].value.trim(); });
        var btn = form.querySelector('[data-loading-submit]');
        btn.disabled = true; btn.textContent = '查詢中…';
        withLoading('查詢中…', function () { go('/receipts', params); });
      });
    }
  };
}
function receiptFieldsHtml(m, err, refs) {
  var ro = m.isLocked ? ' readonly' : '', dis = m.isLocked ? ' disabled' : '';
  function amount(name, label, totalKind) {
    var lbl = totalKind
      ? '<div class="receipt-amount-label-row"><label for="r-' + name + '">' + label + '</label><span class="receipt-amount-total" data-receipt-total="' + totalKind + '">' + label + '累計: 0</span></div>'
      : '<label for="r-' + name + '">' + label + '</label>';
    return '<div class="form-group">' + lbl + '<input id="r-' + name + '" name="' + name + '" type="number" step="any" inputmode="numeric" value="' + esc(m[name]) + '"' + ro + '></div>';
  }
  var html = summaryHtml(err) +
    '<div class="form-group"><label for="r-date">收款日<span class="required">*</span></label>' +
    (m.isEdit
      ? '<input type="text" value="' + esc(m.displayNo) + '" readonly><p class="field-hint">收款日與序號不可更改。若本筆可刪除，可刪除後重新建立。</p>'
      : '<input id="r-date" name="receiptDate" type="date" value="' + esc(m.receiptDate) + '"' + errClass(err, 'receiptDate') + '>' + fieldError(err, 'receiptDate') + '<p class="field-hint">序號於送出時自動取當日最大號加一。</p>') +
    '</div>' +
    '<div class="form-group"><label for="r-cust">客戶編號<span class="required">*</span></label><div class="code-row">' +
    '<input id="r-cust" name="customerCode" maxlength="8" placeholder="如 C001" autocomplete="off" data-customer-code value="' + esc(m.customerCode) + '"' + ro + errClass(err, 'customerCode') + '>' +
    '<input name="customerName" placeholder="客戶簡稱" readonly data-customer-name value="' + esc(m.customerName || '') + '"></div>' +
    '<p class="field-hint" data-customer-hint>輸入客戶代號自動帶出簡稱與業務</p>' + fieldError(err, 'customerCode') + '</div>' +
    '<div class="form-group"><label>業務</label><input type="text" value="' + esc(m.salesDisplay || '') + '" readonly data-customer-sales></div>' +
    amount('cash', '現金') + amount('check', '支票') + amount('arrears', '暫欠', 'arrears') + amount('temp', '暫收', 'temporary-receipt') +
    '<div class="form-group"><label>製單者</label><input type="text" value="' + esc(m.userDisplay) + '" readonly></div>';
  if (m.existing && m.existing.length) {
    html += '<div class="form-group"><label>已上傳的收款單（' + m.existing.length + ' 張）</label><div class="upload-tiles" data-lightbox>' +
      m.existing.map(function (f, i) {
        var isPdf = f.type === 'application/pdf';
        var ref = refs.push(f) - 1;
        return '<div class="upload-tile">' +
          (isPdf ? '<a class="upload-tile-preview" href="#" data-file-ref="' + ref + '"><span class="upload-tile-icon">📄</span></a>'
            : '<a class="upload-tile-preview" href="#"><img src="' + esc(f.data) + '" alt="收款單"></a>') +
          '<div class="upload-tile-name" title="' + esc(f.name) + '">' + esc(f.name) + '</div>' +
          '<label class="upload-tile-remove"><input type="checkbox" name="removeFiles" value="' + i + '"' + dis + '> 移除</label></div>';
      }).join('') + '</div><p class="field-hint">勾選「移除」的檔案會在送出後刪除，未勾選的保留；送出前都可以取消勾選。</p></div>';
  }
  html += uploadFieldHtml({ id: 'receipt-files', label: '上傳收款單', accept: 'image/*,application/pdf', exts: RECEIPT_EXTS, disabled: m.isLocked,
    hint: '可一次選多個檔案，也可分多次追加（JPG／PNG／WEBP／GIF／PDF，單檔上限 10MB）。' });
  return html;
}
function readReceiptForm(form, base) {
  var m = Object.assign({}, base);
  if (form.elements.receiptDate) m.receiptDate = form.elements.receiptDate.value;
  ['customerCode', 'cash', 'check', 'arrears', 'temp'].forEach(function (k) { m[k] = form.elements[k].value; });
  m.customerCode = up(m.customerCode.trim());
  return m;
}
function refillReceipt(m) {
  var c = customerLookup(m.customerCode);
  m.customerName = c ? c.name : '';
  m.salesDisplay = c ? ((c.salesCode || '') + '　' + (c.salesName || '')).trim() : '';
  return m;
}
function receiptAmounts(m) {
  var out = {}, bad = false;
  ['cash', 'check', 'arrears', 'temp'].forEach(function (k) { var v = parseAmount(m[k]); if (v != null && isNaN(v)) bad = true; out[k] = v == null || isNaN(v) ? 0 : v; });
  return bad ? null : out;
}
function receiptCreatePage(p, model, err) {
  var me = currentUser();
  model = model || { receiptDate: todayIso(), customerCode: '', customerName: '', salesDisplay: '', cash: '0', check: '0', arrears: '0', temp: '0' };
  model.userDisplay = me.userId + '　' + me.name;
  model.isEdit = false;
  err = err || newErrors();
  var refs = [];
  var fields = receiptFieldsHtml(model, err, refs);
  return {
    title: '新增收款', heading: '新增收款', backUrl: '#/receipts', fileRefs: refs,
    html: '<form id="receipt-form" novalidate data-customer-lookup data-receipt-balance-lookup>' + fields + '<button type="submit" class="btn btn-primary btn-block">確認新增</button></form>',
    mount: function () {
      var form = document.getElementById('receipt-form');
      mountCustomerLookup(form);
      mountUploads(form);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var m = readReceiptForm(form, {});
        var errors = newErrors();
        if (!isIso(m.receiptDate)) errors.fields.receiptDate = '請選擇收款日';
        if (!m.customerCode) errors.fields.customerCode = '請填寫客戶編號';
        var amounts = receiptAmounts(m);
        if (!amounts) errors.summary.push('金額格式不正確');
        var files = pickedFiles(form);
        if (!hasErrors(errors)) {
          var c = customerLookup(m.customerCode);
          var uploadErr = validateUploads(files, RECEIPT_EXTS, 'file');
          if (uploadErr) errors.summary.push(uploadErr);
          else if (!c) errors.summary.push('查無客戶編號');
          else if (files.length > DEMO_MAX_FILES) errors.summary.push('示範版每筆最多 ' + DEMO_MAX_FILES + ' 個附件');
        }
        if (hasErrors(errors)) { display(receiptCreatePage(p, refillReceipt(m), errors)); return; }
        showLoading('儲存中…');
        convertAll(files).then(function (stored) {
          hideLoading();
          var cust = customerLookup(m.customerCode);
          var seq = null;
          var r = commit(function () {
            var max = 0;
            db.receipts.forEach(function (x) { if (x.date === m.receiptDate) { var n = parseInt(x.seq, 10); if (n > max) max = n; } });
            if (max >= 999) return fail(toRoc(m.receiptDate) + ' 的收款單序號已達上限 999');
            seq = pad3(max + 1);
            db.receipts.push({ date: m.receiptDate, seq: seq, voucherDate: m.receiptDate, customerCode: cust.code, userId: me.userId,
              salesCode: cust.salesCode || null, cash: amounts.cash, check: amounts.check, temp: amounts.temp, arrears: amounts.arrears,
              pamt2: 0, pamt3: 0, files: stored, num1: null, hasSettlements: false });
          });
          if (!r.ok) { errors.summary.push(r.error); display(receiptCreatePage(p, refillReceipt(m), errors)); return; }
          flash('收款單 ' + toRoc(m.receiptDate) + '-' + seq + ' 已新增');
          go('/receipts', { DateFrom: m.receiptDate, DateTo: m.receiptDate });
        }).catch(function (ex) { hideLoading(); errors.summary.push(ex.message); display(receiptCreatePage(p, refillReceipt(m), errors)); });
      });
    }
  };
}
function receiptEditPage(p, model, err) {
  var rec = findReceipt(p.date, p.seq);
  if (!rec) return notFoundPage();
  var row = receiptRow(rec);
  var me = currentUser();
  model = model || {
    customerCode: row.customerCode, customerName: row.customerName,
    salesDisplay: ((row.salesCode || '') + '　' + (row.salesName || '')).trim(),
    cash: String(row.cash), check: String(row.check), arrears: String(row.arrears), temp: String(row.temp)
  };
  model.isEdit = true;
  model.displayNo = row.displayNo;
  model.isLocked = row.isLocked;
  model.existing = rec.files;
  model.userDisplay = row.userId ? (row.userId + '　' + (row.userName || '')).trim() : me.userId + '　' + me.name;
  err = err || newErrors();
  var refs = [];
  var back = href('/receipts', { DateFrom: rec.date, DateTo: rec.date });
  var html = '<form id="receipt-form" novalidate data-customer-lookup data-receipt-balance-lookup>' + receiptFieldsHtml(model, err, refs) +
    (row.isLocked ? '<button type="submit" class="btn btn-gray btn-block" disabled>已鎖定，不可儲存</button>' : '<button type="submit" class="btn btn-primary btn-block">確認更正</button>') +
    '</form>' +
    (row.canDelete ? '<a class="btn btn-danger btn-block" style="margin-top:10px;" href="' + esc(href('/receipts/delete', { date: rec.date, seq: rec.seq })) + '">刪除這筆收款單</a>'
      : !row.isLocked ? '<p class="field-hint" style="margin-top:10px;">已有沖帳明細時不可刪除收款單。</p>' : '');
  return {
    title: '更正收款', heading: '更正收款', backUrl: back, fileRefs: refs, html: html,
    mount: function () {
      var form = document.getElementById('receipt-form');
      mountCustomerLookup(form);
      mountUploads(form);
      mountRemoveTiles(form);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var errors = newErrors();
        if (row.isLocked) { errors.summary.push('此收款單已產生傳票，不可儲存變更'); display(receiptEditPage(p, null, errors)); return; }
        var m = readReceiptForm(form, {});
        if (!m.customerCode) errors.fields.customerCode = '請填寫客戶編號';
        var amounts = receiptAmounts(m);
        if (!amounts) errors.summary.push('金額格式不正確');
        var removed = checkedValues(form, 'removeFiles').map(Number);
        var kept = rec.files.filter(function (_, i) { return removed.indexOf(i) < 0; });
        var files = pickedFiles(form);
        if (!hasErrors(errors)) {
          var uploadErr = validateUploads(files, RECEIPT_EXTS, 'file');
          if (uploadErr) errors.summary.push(uploadErr);
          else if (!customerLookup(m.customerCode)) errors.summary.push('查無客戶編號');
          else if (kept.length + files.length > DEMO_MAX_FILES) errors.summary.push('示範版每筆最多 ' + DEMO_MAX_FILES + ' 個附件');
        }
        if (hasErrors(errors)) { display(receiptEditPage(p, refillReceipt(m), errors)); return; }
        showLoading('儲存中…');
        convertAll(files).then(function (stored) {
          hideLoading();
          var cust = customerLookup(m.customerCode);
          var r = commit(function () {
            // 業務代碼跟著客戶走：換了客戶才重新帶入；傳票日期一律等於收款日
            var changed = up(rec.customerCode) !== cust.code;
            rec.voucherDate = rec.date;
            rec.customerCode = cust.code;
            if (changed || !rec.salesCode) rec.salesCode = cust.salesCode || null;
            rec.cash = amounts.cash; rec.check = amounts.check; rec.temp = amounts.temp; rec.arrears = amounts.arrears;
            rec.files = kept.concat(stored);
          });
          if (!r.ok) { errors.summary.push(r.error); display(receiptEditPage(p, refillReceipt(m), errors)); return; }
          flash('收款單 ' + row.displayNo + ' 已更正');
          go('/receipts', { DateFrom: rec.date, DateTo: rec.date });
        }).catch(function (ex) { hideLoading(); errors.summary.push(ex.message); display(receiptEditPage(p, refillReceipt(m), errors)); });
      });
    }
  };
}
/** 刪除收款單：第一段為確認頁，第二段需勾選確認才啟用按鈕，按下時再跳確認視窗 */
function receiptDeletePage(p) {
  var rec = findReceipt(p.date, p.seq);
  if (!rec) return notFoundPage();
  var row = receiptRow(rec);
  if (!row.canDelete) return deniedPage();
  var back = href('/receipts', { DateFrom: rec.date, DateTo: rec.date });
  var html = '<div class="card"><div class="card-title" style="color:#ea4335;">⚠ 確認刪除這筆收款單？</div>' +
    '<p class="field-hint" style="margin:8px 0 0;">刪除後這筆收款資料會從收款作業永久移除，一併刪除已上傳的收款單附件，且無法復原。</p>' +
    '<div class="detail-lines" style="margin-top:12px;">收款單號：<span>' + esc(row.displayNo) + '</span>\n客戶：<span>' + esc(row.customerCode) + '　' + esc(row.customerName || '') + '</span>\n' +
    '現金：<span>' + n0(row.cash) + '</span>\n支票：<span>' + n0(row.check) + '</span>\n暫收：<span>' + n0(row.temp) + '</span>\n暫欠：<span>' + n0(row.arrears) + '</span>\n' +
    '業務：<span>' + esc(row.salesCode || '') + '　' + esc(row.salesName || '') + '</span>\n製單者：<span>' + esc(row.userId || '') + '　' + esc(row.userName || '') + '</span></div>' +
    (rec.files.length ? '<p class="field-hint" style="margin:10px 0 0;">將一併刪除 ' + rec.files.length + ' 個附件：</p><div class="detail-lines">' +
      rec.files.map(function (f) { return '<span>' + esc(f.name) + '</span>'; }).join('\n') + '</div>' : '') + '</div>' +
    '<div class="info-box" style="border:1px solid #ea4335;"><label style="display:flex;align-items:center;gap:8px;font-weight:600;">' +
    '<input type="checkbox" id="confirm-check"> 我已確認要刪除收款單 ' + esc(row.displayNo) + '</label></div>' +
    '<button type="button" class="btn btn-danger btn-block" id="delete-btn" disabled>確認刪除</button>' +
    '<a class="btn btn-gray btn-block" style="margin-top:10px;" href="' + esc(back) + '">取消</a>';
  return {
    title: '刪除收款', heading: '刪除收款', backUrl: back, html: html,
    mount: function () {
      var check = document.getElementById('confirm-check'), btn = document.getElementById('delete-btn');
      check.addEventListener('change', function () { btn.disabled = !check.checked; });
      btn.addEventListener('click', function () {
        if (!check.checked) { showToast('請先勾選確認，才能刪除這筆收款單'); return; }
        if (!window.confirm('收款單 ' + row.displayNo + ' 刪除後無法復原，確定要刪除嗎？')) return;
        var r = commit(function () {
          var cur = findReceipt(rec.date, rec.seq);
          if (!cur) return fail('找不到這筆收款單，可能已被刪除');
          var cr = receiptRow(cur);
          if (cr.isLocked) return fail('此收款單已產生傳票，不可刪除');
          if (cr.hasSettlements) return fail('此收款單已有沖帳明細，不可刪除');
          db.receipts.splice(db.receipts.indexOf(cur), 1);
        });
        flash(r.ok ? '收款單 ' + row.displayNo + ' 已刪除' : r.error);
        go('/receipts', { DateFrom: rec.date, DateTo: rec.date });
      });
    }
  };
}

/* =========================================================
   啟動
   ========================================================= */
window.addEventListener('hashchange', render);
render();
})();
</script>
</body>
</html>
