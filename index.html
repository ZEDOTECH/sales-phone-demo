<!DOCTYPE html>
<!--
  ============================================================================
  業務行動銷售系統 — 通用示範版（單一檔案 SPA）

  用途：給進口貿易批發商展示的業務手機系統示範，涵蓋預售紀錄、品項詳細、
        新增／修改／刪除預售、我的預售、異常回報、行情表、收款作業、登入鎖定。
        內建多組「產業組合」（生鮮蔬果、冷凍肉品、冷凍海鮮、進口酒類），
        欄位名稱、數量單位、異常原因與示範資料皆隨產業切換。

  使用方式：直接用瀏覽器開啟本檔即可（離線可用，不需任何建置或伺服器）。
  示範帳密：demo / demo123（業務員 王小明 S01）
            demo2 / demo123（業務員 李小華 S02）
            viewer / demo123（非業務員帳號，無業務員代號）

  切換產業：登入頁或每頁底部的「示範產業」選單；或於網址加上 ?industry=meat
            （可用值：produce、meat、seafood、wine）。切換時會重建該產業的示範資料。
  新增產業：在 <script> 開頭的 INDUSTRY_PRESETS 複製一組並修改。

  資料儲存：全部存在瀏覽器 localStorage，key 前綴為 salesphone_generic_v1。
            圖片以 FileReader 讀入後壓縮成最長邊 800px 的 JPEG dataURL 再存入。
  重置示範資料：登入頁或每頁底部的「重置示範資料」按鈕；
                或於 DevTools Console 執行 localStorage.clear() 後重新整理。

  注意：本檔所有公司、客戶、業務員、訂單、廠商、品牌、金額皆為虛構示範資料，與任何真實資料無關。
  ============================================================================
-->
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>業務行動銷售系統（示範版）</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* =========================================================
   業務行動銷售系統 — 行動裝置優先樣式
   主色 #1a73e8，狀態色沿用 Google Material 色票
   ========================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-padding-top: 104px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background: #f0f2f5; color: #333; min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
a { text-decoration: none; color: inherit; }

/* ---- HEADER ---- */
.app-chrome { position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.header { background: #1a73e8; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
.header h1 { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back-btn { color: #fff; font-size: 22px; line-height: 1; padding: 2px 6px 2px 0; }
.header-user { font-size: 12px; opacity: .85; white-space: nowrap; }
.header h1.header-title-sm { flex: 0 0 auto; font-size: 16px; font-weight: 600; white-space: nowrap; }
.header-search { flex: 0 1 420px; max-width: 420px; margin: 0 auto; display: flex; gap: 6px; align-items: center; min-width: 0; }
.header-search input {
  flex: 1; min-width: 0; padding: 8px 12px; border: none; border-radius: 8px; font-size: 14px; outline: none;
  background: #fff; color: #333; font-family: inherit;
}
.header-search button {
  flex: 0 0 auto; background: rgba(255,255,255,.25); border: none; color: #fff;
  border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 15px; line-height: 1;
}
.header-query-btn {
  background: rgba(255,255,255,.2); color: #fff; padding: 7px 10px; border: none; cursor: pointer;
  border-radius: 7px; font-size: 13px; white-space: nowrap; font-family: inherit;
}
@media (max-width: 600px) {
  .header h1.header-title-sm { display: none; }
  .header-search { flex: 1 1 auto; max-width: none; margin: 0; }
}
.logout-btn {
  background: rgba(255,255,255,.2); border: none; color: #fff; padding: 6px 12px; border-radius: 6px;
  cursor: pointer; font-size: 13px; white-space: nowrap; font-family: inherit;
}

/* ---- CONTENT ---- */
.content { padding: 14px; }

/* ---- LOGIN ---- */
.login-screen {
  background: linear-gradient(160deg, #1a73e8, #0d47a1); min-height: 100vh;
  display: flex; justify-content: center; align-items: center; margin: -14px; padding: 14px;
}
.login-card { background: #fff; border-radius: 18px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo .logo-icon { font-size: 48px; line-height: 1; margin-bottom: 8px; }
.login-logo h2 { font-size: 22px; color: #1a73e8; font-weight: 700; }
.login-logo p { color: #999; font-size: 13px; margin-top: 4px; }
.demo-hint { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; margin-bottom: 18px; font-size: 12px; color: #666; line-height: 1.7; }
.demo-hint strong { color: #444; display: block; margin-bottom: 2px; }
.demo-hint code { background: #e8f0fe; color: #1557b0; padding: 0 4px; border-radius: 4px; font-family: inherit; }

/* ---- FORM ---- */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 9px; font-size: 15px; outline: none;
  transition: border-color .2s, box-shadow .2s; background: #fff; color: #333; appearance: auto; font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.12); }
.form-group textarea { resize: none; height: 82px; line-height: 1.5; }
.form-group input[readonly] { background: #f5f5f5; color: #666; border-style: dashed; }
.required { color: #ea4335; }
.code-row { display: flex; gap: 8px; }
.code-row input:first-child { flex: 0 0 40%; }
.code-row input:last-child { flex: 1; }
.field-hint { font-size: 12px; color: #999; margin-top: 5px; }
.field-hint.err { color: #ea4335; }
.receipt-amount-label-row { display: flex; align-items: baseline; gap: 18px; }
.receipt-amount-label-row label { margin-bottom: 6px; }
.receipt-amount-total { color: #ea4335; font-size: 13px; font-weight: 500; }

/* ---- BUTTONS ---- */
.btn {
  display: inline-block; padding: 13px 18px; border: none; border-radius: 9px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: opacity .15s, transform .1s; text-align: center; font-family: inherit;
}
.btn:active { opacity: .82; transform: scale(.97); }
.btn:disabled { cursor: not-allowed; opacity: .72; }
.btn-block { display: block; width: 100%; }
.btn-primary { background: #1a73e8; color: #fff; }
.btn-sm { padding: 7px 14px; font-size: 13px; font-weight: 500; border-radius: 7px; }
.btn-success { background: #34a853; color: #fff; }
.btn-warning { background: #f9ab00; color: #fff; }
.btn-danger { background: #ea4335; color: #fff; }
.btn-info { background: #4285f4; color: #fff; }
.btn-gray { background: #e0e0e0; color: #444; }
.btn.is-loading { pointer-events: none; }
.button-spinner {
  display: inline-block; width: 13px; height: 13px; margin-right: 5px; vertical-align: -2px;
  border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; animation: query-spin .7s linear infinite;
}
.button-spinner[hidden] { display: none; }

/* ---- NAV TABS ---- */
.nav-tabs { display: flex; background: #fff; border-bottom: 2px solid #e8e8e8; }
.nav-tab {
  flex: 1; padding: 12px 8px; text-align: center; font-size: 14px; color: #777; cursor: pointer;
  border-bottom: 3px solid transparent; margin-bottom: -2px; font-weight: 500; transition: color .2s;
}
.nav-tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
@media (max-width: 400px) { .nav-tab { font-size: 12.5px; padding: 12px 3px; } }

/* ---- CARDS ---- */
.card { background: #fff; border-radius: 13px; padding: 15px; margin-bottom: 12px; box-shadow: 0 1px 5px rgba(0,0,0,.07); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
.card-title { font-size: 15px; font-weight: 600; color: #222; line-height: 1.3; }
.card-subtitle { font-size: 12px; color: #999; margin-top: 3px; }
.result-card { border-left: 4px solid #1a73e8; padding-left: 12px; }
.result-order-no { color: #1a73e8; font-size: 16px; font-weight: 700; line-height: 1.35; }
.result-name-row { display: flex; align-items: baseline; gap: 22px; min-width: 0; }
.result-mprdno { color: #444; font-size: 12px; font-weight: 600; line-height: 1.5; margin-top: 6px; }
.result-product { color: #222; font-size: 16px; font-weight: 700; line-height: 1.35; margin-top: 7px; min-width: 0; }
.result-varieties { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 5px; color: #444; font-size: 14px; overflow-wrap: anywhere; }
.result-meta { color: #777; font-size: 12px; line-height: 1.6; margin: 3px 0 12px; }
.card-mine { border-left: 4px solid #1a73e8; }

/* ---- 行情表 ---- */
.mark-quote { border-top: 1px solid #edf0f2; padding: 10px 0; }
.mark-quote:first-of-type { border-top: none; padding-top: 0; }
.mark-quote:last-child { padding-bottom: 0; }
.mark-amounts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
.mark-remark { margin-top: 8px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.mark-query-actions { flex-wrap: wrap; }
.mark-query-actions select { flex-basis: 100%; }

/* ---- STATS ROW ---- */
.stats-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.stat-item { flex: 1; min-width: 70px; background: #f6f8fc; border-radius: 8px; padding: 8px 10px; }
.stat-label { font-size: 11px; color: #888; margin-bottom: 2px; }
.stat-value { font-size: 16px; font-weight: 700; color: #333; }
.stat-value.positive { color: #1e8e3e; }
.stat-value.zero { color: #d93025; }

/* ---- BADGE ---- */
.badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-green { background: #e6f4ea; color: #1e7e34; }
.badge-red { background: #fce8e6; color: #c5221f; }
.badge-blue { background: #e8f0fe; color: #1557b0; }
.badge-gray { background: #f1f3f4; color: #5f6368; }

/* ---- ACTION / FILTER ROW ---- */
.action-row { display: flex; gap: 8px; justify-content: flex-end; }
.action-row form { margin: 0; }
.filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
.filter-row select, .filter-row input {
  flex: 1; padding: 10px 12px; min-width: 0; border: 1.5px solid #e0e0e0; border-radius: 9px; font-size: 14px;
  background: #fff; color: #333; appearance: auto; outline: none; transition: border-color .2s, box-shadow .2s; font-family: inherit;
}
.filter-row input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.12); }
input[type="date"] { width: 100%; min-width: 0; min-height: 45px; padding: 10px 12px; font-size: 15px; }
.receipt-date-row > div { flex: 1 1 0; min-width: 0; }
.receipt-date-row .filter-label { display: block; }
.roc-date-field { position: relative; }
.roc-date-field input[type="text"] { width: 100%; min-height: 45px; padding-right: 48px; }
.roc-date-icon {
  position: absolute; right: 0; top: 0; bottom: 0; width: 44px; display: flex; align-items: center; justify-content: center;
  border-left: 1px solid #e0e0e0; color: #555; pointer-events: none;
}
.roc-date-field input[type="date"] { position: absolute; right: 0; top: 0; width: 44px; height: 100%; padding: 0; opacity: 0; cursor: pointer; }
.roc-date-field input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; cursor: pointer; }
.roc-date-field:focus-within input[type="text"] { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.12); }
.filter-row .btn { flex: 0 0 auto; }
.filter-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.receipt-sales-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.receipt-sales-field { display: flex; gap: 4px; min-width: 0; }
.receipt-sales-field .btn { padding-inline: 8px; white-space: nowrap; }
.receipt-sales-input { position: relative; display: flex; flex: 1; min-width: 0; }
.receipt-sales-input:has(.receipt-sales-clear:not([hidden])) input { padding-right: 38px; }
.receipt-sales-clear {
  position: absolute; inset: 1px 1px 1px auto; width: 36px; border: 0; border-radius: 8px; background: transparent;
  color: #555; font: inherit; font-size: 22px; line-height: 1; cursor: pointer;
}
.receipt-sales-clear[hidden] { display: none; }
.receipt-sales-clear:hover { background: #f0f2f5; }
.receipt-sales-dialog { width: min(440px, calc(100% - 24px)); max-height: 85vh; margin: auto; padding: 16px; border: 0; border-radius: 12px; color: #333; background: #fff; }
.receipt-sales-dialog::backdrop { background: rgba(0,0,0,.4); }
.receipt-sales-results { list-style: none; }
.receipt-sales-results li { margin-top: 6px; }
.receipt-sales-results .btn { text-align: left; padding: 10px 12px; }
@media (max-width: 400px) { .receipt-date-row { gap: 6px; } }

/* ---- 預售紀錄查詢條件 ---- */
.query-card { background: #fff; border-radius: 13px; padding: 15px; margin-bottom: 14px; box-shadow: 0 1px 5px rgba(0,0,0,.07); }
.query-title { color: #1a73e8; font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.date-range { display: flex; align-items: center; gap: 8px; }
.date-range input { min-width: 0; flex: 1; }
.date-range span { color: #777; font-size: 13px; white-space: nowrap; }
.filter-group { border: 0; margin: 0 0 16px; padding: 0; }
.filter-group legend { font-size: 13px; color: #555; font-weight: 500; margin-bottom: 7px; }
.choice-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.choice-btn {
  position: relative; padding: 8px 12px; border: 1.5px solid #e0e0e0; border-radius: 20px; background: #fff; color: #444;
  font-size: 14px; cursor: pointer; transition: background .15s, border-color .15s, color .15s;
}
.choice-btn input { position: absolute; opacity: 0; pointer-events: none; }
.choice-btn.active { background: #e8f0fe; border-color: #1a73e8; color: #1557b0; font-weight: 600; }
.query-actions { display: flex; justify-content: flex-end; gap: 8px; }
.page-loading { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; background: rgba(20,35,55,.28); }
.page-loading[hidden] { display: none; }
.page-loading-card {
  display: flex; align-items: center; gap: 11px; padding: 16px 20px; border-radius: 12px; background: #fff; color: #1557b0;
  font-size: 15px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
.page-spinner { width: 21px; height: 21px; border: 3px solid #d2e3fc; border-top-color: #1a73e8; border-radius: 50%; animation: query-spin .7s linear infinite; }
@keyframes query-spin { to { transform: rotate(360deg); } }

/* ---- 採購單表頭 ---- */
.po-head { background: #fff; border-radius: 13px; padding: 13px 15px; margin-bottom: 12px; box-shadow: 0 1px 5px rgba(0,0,0,.07); border-left: 4px solid #1a73e8; }
.po-head-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.po-head .po-no { font-size: 15px; font-weight: 700; color: #1a73e8; }
.po-head .po-meta { font-size: 12px; color: #777; margin-top: 5px; line-height: 1.7; }
.po-export-btn { white-space: nowrap; }

/* ---- INFO BOX ---- */
.info-box { background: #e8f0fe; border-radius: 10px; padding: 13px 14px; margin-bottom: 18px; font-size: 13px; color: #1557b0; line-height: 1.6; }
.info-box strong { display: block; font-size: 16px; color: #1a73e8; margin-bottom: 4px; font-weight: 600; }

/* ---- DETAIL LINES ---- */
.detail-lines { font-size: 13px; color: #555; line-height: 1.9; white-space: pre-line; }
.detail-lines span { color: #222; font-weight: 600; }

/* ---- EMPTY STATE ---- */
.empty-state { text-align: center; padding: 52px 16px; color: #aaa; }
.empty-state .empty-icon { font-size: 52px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }

/* ---- VALIDATION ---- */
.err-text, .validation-summary-errors { color: #ea4335; font-size: 13px; margin-bottom: 12px; }
.validation-summary-errors ul { list-style: none; }
.field-validation-error { color: #ea4335; font-size: 12px; display: block; margin-top: 5px; }
.input-validation-error { border-color: #ea4335 !important; }

/* ---- 異常原因多選 ---- */
.reason-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.reason-btn {
  padding: 8px 14px; border: 1.5px solid #e0e0e0; border-radius: 20px; background: #fff; color: #444; font-size: 14px;
  cursor: pointer; font-family: inherit; transition: background .15s, border-color .15s, color .15s;
}
.reason-btn:active { transform: scale(.97); }
.reason-btn.active { background: #e8f0fe; border-color: #1a73e8; color: #1557b0; font-weight: 600; }

/* ---- 縮圖 ---- */
.defect-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.defect-thumbs img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; border: 1px solid #e0e0e0; display: block; cursor: pointer; }
.defect-edit-images { display: flex; flex-wrap: wrap; gap: 10px; }
.defect-edit-image { width: 108px; overflow: hidden; border: 1px solid #e0e0e0; border-radius: 8px; background: #fafafa; color: #555; font-size: 12px; }
.form-group label.defect-edit-image { display: block; margin: 0; font-weight: 400; }
.defect-edit-image img { width: 108px; height: 88px; object-fit: cover; display: block; }
.defect-edit-image span { display: block; padding: 6px; }
.form-group .defect-edit-image input { width: auto; margin-right: 3px; vertical-align: middle; padding: 0; }
.receipt-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.receipt-thumbs img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; border: 1px solid #e0e0e0; display: block; cursor: pointer; }
.upload-tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.upload-tiles:empty { display: none; }
.upload-tile { width: 108px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fafafa; overflow: hidden; font-size: 12px; color: #555; }
.upload-tile-preview { display: block; width: 108px; height: 88px; background: #fff; cursor: pointer; }
.upload-tile-preview img { width: 108px; height: 88px; object-fit: cover; display: block; }
.upload-tile-icon { display: flex; align-items: center; justify-content: center; width: 108px; height: 88px; font-size: 30px; }
.upload-tile-name { padding: 6px 6px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upload-tile-size { padding: 0 6px; color: #999; font-size: 11px; }
.upload-tile .upload-tile-remove {
  display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; margin: 5px 0 0; padding: 7px 6px;
  border: none; border-top: 1px solid #eee; background: none; color: #ea4335; font: inherit; font-size: 12px; font-weight: 500;
  cursor: pointer; text-align: center;
}
.upload-tile .upload-tile-remove input[type="checkbox"] {
  width: auto; margin: 0; padding: 0; border: none; border-radius: 0; box-shadow: none; appearance: auto; accent-color: #ea4335;
}
.upload-tile.removed { opacity: .45; }
.upload-tile.removed .upload-tile-name { text-decoration: line-through; }
.form-group input[type="file"] { padding: 10px 12px; background: #fafafa; border: 1.5px dashed #ccc; }

/* ---- LIGHTBOX ---- */
.lightbox { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; }
.lightbox[hidden] { display: none; }
.lb-img { max-width: 92vw; max-height: 82vh; object-fit: contain; border-radius: 6px; }
.lb-close { position: absolute; top: 12px; right: 18px; font-size: 34px; line-height: 1; color: #fff; background: none; border: none; cursor: pointer; }
.lb-prev, .lb-next {
  position: absolute; top: 50%; transform: translateY(-50%); font-size: 30px; color: #fff; background: rgba(0,0,0,.35);
  border: none; cursor: pointer; padding: 14px 18px; border-radius: 10px;
}
.lb-prev { left: 10px; }
.lb-next { right: 10px; }
.lb-count { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 14px; background: rgba(0,0,0,.45); padding: 4px 14px; border-radius: 20px; }

/* ---- PAGER ---- */
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 18px; }
.pager-info { font-size: 13px; color: #777; white-space: nowrap; }
.pager .disabled { opacity: .45; pointer-events: none; }

function cmp(a, b) {
  var an = a == null || a === '', bn = b == null || b === '';
  if (an && bn) return 0;
  if (an) return -1;
  if (bn) return 1;
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  a = String(a); b = String(b);
  return a < b ? -1 : a > b ? 1 : 0;
}
function sumBy(list, fn) { return list.reduce(function (s, x) { return s + fn(x); }, 0); }
function parseAmount(v) {
  if (v == null || String(v).trim() === '') return null;
  var n = Number(v);
  return isFinite(n) ? n : NaN;
}
function totalPagesOf(count) { return Math.max(1, Math.ceil(count / PAGE_SIZE)); }
function clampPage(p, total) { var n = parseInt(p, 10) || 1; return Math.min(Math.max(1, n), total); }
function sizeText(bytes) {
  return bytes >= 1024 * 1024 ? (bytes / 1024 / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB';
}
function extOf(name) { var i = name.lastIndexOf('.'); return i < 0 ? '' : name.slice(i).toLowerCase(); }

/* =========================================================
   目前產業：網址 ?industry=xxx 優先（切換時會重建示範資料），否則讀 localStorage，預設生鮮蔬果。
   產業在頁面載入時決定，切換產業一律重新載入頁面。
   ========================================================= */
function resolveIndustry() {
  var stored = lsGet(INDUSTRY_KEY);
  var current = INDUSTRY_PRESETS[stored] ? stored : DEFAULT_INDUSTRY;
  var wanted = null;
  try { wanted = new URLSearchParams(location.search).get('industry'); } catch (e) { wanted = null; }
  if (wanted && INDUSTRY_PRESETS[wanted]) {
    if (wanted !== current) {
      // 換產業：清掉前一個產業的示範資料與查詢紀錄，載入後會依新產業重建
      lsRemove(STORE_KEY);
      lsRemove(LASTQUERY_KEY);
    }
    current = wanted;
    // 寫入成功才把網址參數拿掉；私密視窗寫不進去時保留參數，重新整理仍是同一產業
    if (lsTrySet(INDUSTRY_KEY, current)) {
      try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* 忽略 */ }
    }
  }
  return current;
}

/* =========================================================
   資料庫（localStorage）
   ========================================================= */
var db = loadDb();
function loadDb() {
  var d = readJson(STORE_KEY);
  if (d && d.version === DATA_VERSION && d.industry === INDUSTRY) return d;
  var fresh = seed();
  lsTrySet(STORE_KEY, JSON.stringify(fresh));
  return fresh;
}
/** 在記憶體套用異動後寫回 localStorage；寫入失敗（容量不足）時整個回捲，等同交易。 */
function commit(mutate) {
  var backup = JSON.stringify(db);
  var result = mutate();
  if (result && result.ok === false) return result;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(db));
  } catch (e) {
    db = JSON.parse(backup);
    return fail('瀏覽器儲存空間不足，請移除部分圖片，或按頁面底部的「重置示範資料」');
  }
  return result || ok();
}
function ok(value) { return { ok: true, value: value }; }
function fail(error) { return { ok: false, error: error }; }
function resetDemo() {
  [STORE_KEY, THROTTLE_KEY, LASTQUERY_KEY].forEach(lsRemove);
  db = seed();
  lsTrySet(STORE_KEY, JSON.stringify(db));
}

/* =========================================================
   登入／Session／暴力破解防護（模擬 LoginThrottle：同一帳號 15 分鐘內錯 5 次鎖 15 分鐘）
   ========================================================= */
function currentUser() {
  var s = readJson(SESSION_KEY);
  if (!s || !s.userId) return null;
  return db.users.some(function (u) { return u.userId === s.userId; }) ? s : null;
}
function resolveSalesCode(userName) {
  var s = db.salesmen.filter(function (x) { return x.name === userName; })[0];
  return s ? s.code : '';
}
function throttleAll() { return readJson(THROTTLE_KEY) || {}; }
function retryAfter(account) {
  var c = throttleAll()[account.toLowerCase()];
  return c && c.lockedUntil && c.lockedUntil > Date.now() ? c.lockedUntil - Date.now() : null;
}
function recordFailure(account) {
  var all = throttleAll(), key = account.toLowerCase(), now = Date.now(), c = all[key];
  if (!c || now - c.first > THROTTLE.windowMs) c = { failures: 0, first: now };
  c.failures++;
  if (c.failures >= THROTTLE.maxFailures) c.lockedUntil = now + THROTTLE.lockMs;
  all[key] = c;
  lsTrySet(THROTTLE_KEY, JSON.stringify(all));
  return c;
}
function resetThrottle(account) {
  var all = throttleAll();
  delete all[account.toLowerCase()];
  lsTrySet(THROTTLE_KEY, JSON.stringify(all));
}

/* =========================================================
   路由（hash）
   ========================================================= */
function parseHash() {
  var h = location.hash.slice(1) || '/items';
  var i = h.indexOf('?');
  var path = i < 0 ? h : h.slice(0, i);
  var params = {};
  new URLSearchParams(i < 0 ? '' : h.slice(i + 1)).forEach(function (v, k) { params[k] = v; });
  return { path: path, params: params };
}
function href(path, params) {
  var p = new URLSearchParams();
  Object.keys(params || {}).forEach(function (k) {
    var v = params[k];
    if (v !== undefined && v !== null && v !== '') p.set(k, String(v));
  });
  var s = p.toString();
  return '#' + path + (s ? '?' + s : '');
}
function go(path, params) {
  var target = href(path, params);
  if (location.hash === target) render();
  else location.hash = target;
}

/** 以 Blob URL 在新分頁開啟附件（瀏覽器不允許直接開 data: URL） */
function openFile(file) {
  if (!file) return;
  if (file.type.indexOf('image/') === 0) { openLightbox([file.data], 0); return; }
  try {
    var parts = file.data.split(',');
    var bin = atob(parts[1]);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: file.type }));
    window.open(url, '_blank', 'noopener');
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  } catch (err) {
    showToast('無法開啟附件');
  }
}

/* ---- 客戶代號自動帶出簡稱／業務員 ---- */
function customerLookup(code) {
  var key = up(String(code || '').trim());
  if (!key) return null;
  var c = db.customers.filter(function (x) { return x.code === key; })[0];
  if (!c) return null;
  var s = c.salesCode ? db.salesmen.filter(function (x) { return x.code === c.salesCode; })[0] : null;
  return { code: c.code, name: c.name, salesCode: c.salesCode || null, salesName: s ? s.name : null };
}
function salesmanName(code) {
  var s = db.salesmen.filter(function (x) { return x.code === code; })[0];
  return s ? s.name : null;
}
function userName(userId) {
  var u = db.users.filter(function (x) { return x.userId === userId; })[0];
  return u ? u.name : null;
}
/** 客戶的暫收／暫欠未沖款累計（暫收−已沖、暫欠−已沖，差額為 0 不計） */
function unappliedTotals(code) {
  var key = up(String(code || '').trim());
  var temp = 0, arrears = 0;
  db.receipts.forEach(function (r) {
    if (r.customerCode !== key) return;
    var a = (r.temp || 0) - (r.pamt2 || 0), b = (r.arrears || 0) - (r.pamt3 || 0);
    if (a !== 0) temp += a;
    if (b !== 0) arrears += b;
  });
  return { temporaryReceipt: temp, arrears: arrears };
}
function mountCustomerLookup(scope) {
  var codeInput = scope.querySelector('[data-customer-code]');
  var nameInput = scope.querySelector('[data-customer-name]');
  if (!codeInput || !nameInput) return;
  var salesInput = scope.querySelector('[data-customer-sales]');
  var hint = scope.querySelector('[data-customer-hint]');
  var balance = scope.hasAttribute('data-receipt-balance-lookup');
  var arrearsTotal = scope.querySelector('[data-receipt-total="arrears"]');
  var tempTotal = scope.querySelector('[data-receipt-total="temporary-receipt"]');
  var defaultHint = hint ? hint.textContent : '';
  var timer;

  function reset() {
    nameInput.value = '';
    if (salesInput) salesInput.value = '';
    if (hint) { hint.textContent = defaultHint; hint.classList.remove('err'); }
    if (arrearsTotal) arrearsTotal.textContent = '暫欠累計: 0';
    if (tempTotal) tempTotal.textContent = '暫收累計: 0';
  }
  function lookup() {
    var code = codeInput.value.trim();
    if (!code) { reset(); return; }
    if (balance) {
      var t = unappliedTotals(code);
      if (arrearsTotal) arrearsTotal.textContent = '暫欠累計: ' + amountText(t.arrears);
      if (tempTotal) tempTotal.textContent = '暫收累計: ' + amountText(t.temporaryReceipt);
    }
    var data = customerLookup(code);
    nameInput.value = data ? data.name : '';
    var hasSales = !!(data && data.salesCode && data.salesName);
    if (salesInput) salesInput.value = hasSales ? data.salesCode + '　' + data.salesName : '';
    if (hint) {
      hint.textContent = !data ? '查無此客戶代號' : salesInput && !hasSales ? '此客戶尚未設定有效的業務員' : '';
      hint.classList.toggle('err', !data || (!!salesInput && !hasSales));
    }
  }
  codeInput.addEventListener('input', function () { reset(); clearTimeout(timer); timer = setTimeout(lookup, 250); });
  codeInput.addEventListener('change', function () { clearTimeout(timer); lookup(); });
  codeInput.addEventListener('blur', lookup);
  if (balance && codeInput.value.trim()) lookup();
}

function mountUploads(scope) {
  scope.querySelectorAll('[data-upload-input]').forEach(function (input) {
    var group = input.closest('.form-group');
    var preview = group.querySelector('[data-upload-preview]');
    var error = group.querySelector('[data-upload-error]');
    var allowed = input.getAttribute('data-upload-accept').split(',');
    var urls = [];
    input._picked = [];

    function renderTiles() {
      urls.forEach(function (u) { URL.revokeObjectURL(u); });
      urls = [];
      preview.textContent = '';
      input._picked.forEach(function (file, index) {
        var tile = document.createElement('div');
        tile.className = 'upload-tile';
        if (file.type.indexOf('image/') === 0) {
          var u = URL.createObjectURL(file);
          urls.push(u);
          var link = document.createElement('span');
          link.className = 'upload-tile-preview';
          var img = document.createElement('img');
          img.src = u; img.alt = file.name;
          link.appendChild(img);
          tile.appendChild(link);
        } else {
          var icon = document.createElement('div');
          icon.className = 'upload-tile-icon';
          icon.textContent = '📄';
          tile.appendChild(icon);
        }
        var name = document.createElement('div');
        name.className = 'upload-tile-name'; name.title = file.name; name.textContent = file.name;
        tile.appendChild(name);
        var size = document.createElement('div');
        size.className = 'upload-tile-size'; size.textContent = sizeText(file.size);
        tile.appendChild(size);
        var remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'upload-tile-remove'; remove.textContent = '✕ 移除';
        remove.addEventListener('click', function () { input._picked.splice(index, 1); renderTiles(); });
        tile.appendChild(remove);
        preview.appendChild(tile);
      });
    }
    input.addEventListener('change', function () {
      var rejected = [];
      [].forEach.call(input.files, function (file) {
        if (allowed.indexOf(extOf(file.name)) < 0) rejected.push(file.name + '：格式不支援');
        else if (file.size > MAX_UPLOAD_BYTES) rejected.push(file.name + '：超過 10.0 MB');
        else if (!input._picked.some(function (x) { return x.name === file.name && x.size === file.size && x.lastModified === file.lastModified; })) input._picked.push(file);
      });
      error.textContent = rejected.join('、');
      error.classList.toggle('err', rejected.length > 0);
      input.value = '';
      renderTiles();
    });
  });
}

/* ---- 檔案轉存：圖片壓縮成 JPEG dataURL，PDF 原樣讀入 ---- */
function readAsDataUrl(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(r.result); };
    r.onerror = function () { reject(new Error('無法讀取上傳的檔案，請重新選擇')); };
    r.readAsDataURL(file);
  });
}
function loadImage(src) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = function () { reject(new Error('無法讀取上傳的圖片，請重新選擇檔案')); };
    img.src = src;
  });
}
function toStoredFile(file) {
  if (extOf(file.name) === '.pdf') {
    if (file.size > DEMO_PDF_MAX) return Promise.reject(new Error('示範版 PDF 單檔上限 1MB：「' + file.name + '」'));
    return readAsDataUrl(file).then(function (data) { return { name: file.name, type: 'application/pdf', data: data }; });
  }
  return readAsDataUrl(file).then(loadImage).then(function (img) {
    var scale = Math.min(1, 800 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
    var w = Math.max(1, Math.round((img.naturalWidth || 1) * scale)), h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return { name: file.name.replace(/\.[^.]+$/, '') + '.jpg', type: 'image/jpeg', data: canvas.toDataURL('image/jpeg', 0.72) };
  });
}
function validateUploads(files, exts, kind) {
  for (var i = 0; i < files.length; i++) {
    if (files[i].size > MAX_UPLOAD_BYTES) return (kind === 'file' ? '檔案' : '圖片') + '「' + files[i].name + '」超過 10MB';
    if (exts.indexOf(extOf(files[i].name)) < 0)
      return kind === 'file' ? '不支援的檔案格式（僅接受 JPG／PNG／WEBP／GIF／PDF）' : '不支援的圖片格式（僅接受 JPG／PNG／WEBP／GIF）';
  }
  return null;
}
function convertAll(files) { return Promise.all(files.map(toStoredFile)); }

/* ---- CSV 下載（模擬 Excel 匯出） ---- */
function csvCell(v) {
  var s = v == null ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv(filename, rows) {
  var text = '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  var url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
/** 下載按鈕顯示 spinner 與「下載中…」，避免重複點擊 */
function runDownload(btn, fn) {
  if (btn.classList.contains('is-loading')) return;
  var spinner = btn.querySelector('[data-loading-spinner]');
  var label = btn.querySelector('[data-loading-text]');
  var original = label.textContent;
  btn.classList.add('is-loading');
  if (spinner) spinner.hidden = false;
  label.textContent = '下載中…';
  setTimeout(function () {
    try { fn(); } finally {
      btn.classList.remove('is-loading');
      if (spinner) spinner.hidden = true;
      label.textContent = original;
    }
  }, 450);
}
function downloadBtnHtml(text, attrs) {

/* =========================================================
   預售業務規則
   ========================================================= */
function isEditable(orderNo) {
  return !!orderNo && db.settings.editableOrderNos.some(function (x) { return up(x) === up(orderNo); });
}
function orderOf(no) { return db.orders.filter(function (o) { return o.orderNo === no; })[0] || null; }
function findItem(orderNo, itemNo) {
  return db.items.filter(function (i) { return i.orderNo === orderNo && i.itemNo === itemNo; })[0] || null;
}
/** 已售量由預售紀錄即時加總 */
function soldOf(orderNo, itemNo) {
  return sumBy(db.presales, function (r) { return r.orderNo === orderNo && r.itemNo === itemNo ? r.qty : 0; });
}
function prodKindName(code) { var f = db.prodKinds.filter(function (x) { return x.code === code; })[0]; return f ? f.name : null; }
function varietyOf(code) { return db.varieties.filter(function (x) { return x.code === code; })[0] || null; }
function summaryOf(item) {
  var o = orderOf(item.orderNo) || {};
  var sold = soldOf(item.orderNo, item.itemNo);
  return {
    orderNo: item.orderNo, itemNo: item.itemNo, productName: item.productName, purchaseQty: item.qty, soldQty: sold,
    available: item.qty - sold, supplierCode: o.supplierCode, supplierName: o.supplierName, arriveDate: o.arriveDate,
    containerNo: o.containerNo, editable: isEditable(item.orderNo), mprdNo: item.mprdNo, airCode: item.airCode,
    prodCode: item.prodCode, groupedCount: 1
  };
}
/** 品種顯示：中英文以一個空格連接，去重後排序 */
function varietyNames(items) {
  var seen = {}, list = [];
  items.forEach(function (i) {
    var v = varietyOf(i.varietyCode);
    if (!v) return;
    var name = [v.zh, v.en].filter(Boolean).join(' ');
    if (name && !seen[up(name)]) { seen[up(name)] = true; list.push(name); }
  });
  return list.sort(function (a, b) { return up(a) < up(b) ? -1 : up(a) > up(b) ? 1 : 0; });
}
var UNLOAD_OPTIONS = ['台灣', '大陸', '第三地', '全部'];
var MARINE_OPTIONS = ['海運', '空運', '全部', '海空運'];
var TRANSFER_OPTIONS = ['全部', '未出貨', '已出貨'];
function normalizeItemQuery(p) {
  var today = todayIso();
  return {
    startDate: isIso(p.startDate) ? p.startDate : today,
    endDate: isIso(p.endDate) ? p.endDate : today,
    unloadCountry: UNLOAD_OPTIONS.indexOf(p.unloadCountry) >= 0 ? p.unloadCountry : '全部',
    marine: MARINE_OPTIONS.indexOf(p.marine) >= 0 ? p.marine : '全部',
    transfer: TRANSFER_OPTIONS.indexOf(p.transfer) >= 0 ? p.transfer : '全部',
    productName: norm(p.productName, 50),
    orderNo: norm(p.orderNo, 20),
    containerNo: norm(p.containerNo, 16),
    englishBrand: norm(p.englishBrand, 50),
    englishVariety: norm(p.englishVariety, 50)
  };
}
function hasIdentifier(q) { return !!(q.orderNo || q.containerNo); }

/**
 * 預售紀錄頁查詢：有訂單編號或櫃號時以前綴比對並略過到貨日區間，
 * 否則以實際到貨日區間為主；再以 訂單＋品名分類＋批號（AIR）整合成一列。
 */
function queryItemGroups(q) {
  var rows = db.items.filter(function (it) { return !!orderOf(it.orderNo); });
  if (q.orderNo) rows = rows.filter(function (it) { return up(it.orderNo).indexOf(up(q.orderNo)) === 0; });
  if (q.containerNo) rows = rows.filter(function (it) { var c = orderOf(it.orderNo).containerNo; return c && up(c).indexOf(up(q.containerNo)) === 0; });
  if (!hasIdentifier(q)) rows = rows.filter(function (it) {
    var d = orderOf(it.orderNo).arriveDate;
    return d && d >= q.startDate && d <= q.endDate;
  });
  var unloadMap = { '台灣': '1', '大陸': '2', '第三地': '3' };
  if (unloadMap[q.unloadCountry]) rows = rows.filter(function (it) { return orderOf(it.orderNo).unloadCountry === unloadMap[q.unloadCountry]; });
  if (q.marine === '海運') rows = rows.filter(function (it) { return orderOf(it.orderNo).marine === '1'; });
  if (q.marine === '空運') rows = rows.filter(function (it) { return orderOf(it.orderNo).marine === '2'; });
  if (q.marine === '海空運') rows = rows.filter(function (it) { var m = orderOf(it.orderNo).marine; return m === '1' || m === '2'; });
  if (q.transfer === '未出貨') rows = rows.filter(function (it) { return orderOf(it.orderNo).transfer !== 'Y'; });
  if (q.transfer === '已出貨') rows = rows.filter(function (it) { return orderOf(it.orderNo).transfer === 'Y'; });
  if (q.productName) {
    var codes = db.prodKinds.filter(function (f) { return f.name.indexOf(q.productName) >= 0; }).map(function (f) { return f.code; });
    rows = rows.filter(function (it) { return codes.indexOf(it.prodCode) >= 0; });
  }
  if (q.englishBrand) rows = rows.filter(function (it) { return ciIncludes(it.productName, q.englishBrand); });
  if (q.englishVariety) {
    var vcodes = db.varieties.filter(function (v) { return ciIncludes(v.zh, q.englishVariety) || ciIncludes(v.en, q.englishVariety); })
      .map(function (v) { return v.code; });
    rows = rows.filter(function (it) { return vcodes.indexOf(it.varietyCode) >= 0; });
  }

  var groupsMap = {}, groups = [];
  rows.forEach(function (it) {
    var key = it.orderNo + '|' + (it.prodCode || '') + '|' + (it.airCode || '');
    if (!groupsMap[key]) { groupsMap[key] = { orderNo: it.orderNo, prodCode: it.prodCode, airCode: it.airCode, items: [] }; groups.push(groupsMap[key]); }
    groupsMap[key].items.push(it);
  });
  var summaries = groups.map(function (g) {
    var list = g.items.slice().sort(function (a, b) { return cmp(a.itemNo, b.itemNo); });
    var o = orderOf(g.orderNo);
    var purchase = sumBy(list, function (i) { return i.qty; });
    var sold = sumBy(list, function (i) { return soldOf(i.orderNo, i.itemNo); });
    var minName = list.map(function (i) { return i.productName; }).sort(cmp)[0];
    return {
      orderNo: g.orderNo, itemNo: list[0].itemNo, productName: prodKindName(g.prodCode) || minName,
      purchaseQty: purchase, soldQty: sold, available: purchase - sold,
      mprdNo: list.map(function (i) { return i.mprdNo; }).sort(cmp)[0], arriveDate: o.arriveDate, containerNo: o.containerNo,
      airCode: g.airCode, prodCode: g.prodCode, groupedCount: list.length, editable: isEditable(g.orderNo),
      varietyNames: varietyNames(list)
    };
  });
  summaries.sort(function (a, b) {
    return cmp(a.arriveDate, b.arriveDate) || -cmp(a.orderNo, b.orderNo) || cmp(a.airCode, b.airCode) || cmp(a.prodCode, b.prodCode);
  });
  var orderSet = {};
  summaries.forEach(function (s) { orderSet[s.orderNo] = true; });
  return { groups: summaries, totalItems: rows.length, orderCount: Object.keys(orderSet).length };
}

/** 同一訂單、同一品名分類、同一批號（AIR）的整合列明細 */
function airGroupDetail(orderNo, airCode, prodCode) {
  var air = norm(airCode), kind = norm(prodCode);
  var list = db.items.filter(function (i) {
    return i.orderNo === orderNo && (air ? i.airCode === air : !i.airCode) && (kind ? i.prodCode === kind : !i.prodCode);
  }).sort(function (a, b) { return cmp(a.productName, b.productName) || cmp(a.itemNo, b.itemNo); });
  if (!list.length) return null;
  var items = list.map(summaryOf);
  var rep = items[0];
  var purchase = sumBy(items, function (i) { return i.purchaseQty; });
  var sold = sumBy(items, function (i) { return i.soldQty; });
  return {
    summary: {
      orderNo: orderNo, itemNo: rep.itemNo, productName: rep.productName, purchaseQty: purchase, soldQty: sold,
      available: purchase - sold, editable: isEditable(orderNo), airCode: air, prodCode: kind, groupedCount: items.length
    },
    items: items
  };
}
function presalesOf(orderNo, itemNo) {
  return db.presales.filter(function (r) { return r.orderNo === orderNo && r.itemNo === itemNo; })
    .sort(function (a, b) { return cmp(a.presaleDate, b.presaleDate) || cmp(a.customerCode, b.customerCode); });
}
function findPresale(k) {
  return db.presales.filter(function (r) {
    return r.orderNo === k.orderNo && r.itemNo === k.itemNo && r.customerCode === k.customerCode && r.presaleDate === k.presaleDate;
  })[0] || null;
}
/** 回寫已售量（erpSoldQty）：以相對加減累加差額（示範版僅保存，不顯示） */
function addToErpSoldQty(orderNo, itemNo, delta) {
  if (!delta) return;
  if (!isEditable(orderNo)) throw new Error('訂單編號 ' + orderNo + ' 不在允許異動的範圍內，已阻止回寫已售量。');
  var item = findItem(orderNo, itemNo);
  if (item) item.erpSoldQty = (item.erpSoldQty || 0) + delta;
}
function validatePresale(orderNo, itemNo, customerCode, qty) {
  if (!isEditable(orderNo)) return { result: fail('訂單編號 ' + orderNo + ' 目前不開放異動') };
  var c = customerLookup(customerCode);
  if (!c) return { result: fail('查無此客戶代號') };
  if (!(qty > 0)) return { result: fail('請填寫有效的預售' + UNIT + '數') };
  if (!findItem(orderNo, itemNo)) return { result: fail('找不到這個品項') };
  return { result: ok(), customer: c };
}
function truncate(v, max) { return !v ? v : v.length <= max ? v : v.slice(0, max); }
function nextSerial(orderNo) {
  var max = 0;
  db.presales.forEach(function (r) { if (r.orderNo === orderNo) { var n = parseInt(r.serial2, 10); if (n > max) max = n; } });
  return pad3(max + 1);
}
function presaleCreate(orderNo, itemNo, customerCode, presaleDate, qty, remark) {
  var v = validatePresale(orderNo, itemNo, customerCode, qty);
  if (!v.result.ok) return v.result;
  var c = v.customer;
  if (!c.salesCode || !c.salesName) return fail('此客戶尚未設定有效的業務員');
  if (findPresale({ orderNo: orderNo, itemNo: itemNo, customerCode: c.code, presaleDate: presaleDate }))
    return fail('同一品項下、同一客戶、同一預售日已有一筆紀錄，請直接修改該筆');
  // 依需求不控管庫存：數量可超過剩餘可售量，差異照實顯示為負數
  return commit(function () {
    db.presales.push({
      orderNo: orderNo, itemNo: itemNo, customerCode: c.code, customerName: c.name, presaleDate: presaleDate, qty: qty,
      salesCode: c.salesCode, salesName: c.salesName, unitPrice: 0, remark: truncate(norm(remark), 20), serial2: nextSerial(orderNo)
    });
    addToErpSoldQty(orderNo, itemNo, qty);
  });
}
/** 修改不限本人；業務員維持原值。改客戶或預售日（主鍵）時以「刪舊鍵、建新鍵」換筆 */
function presaleUpdate(key, customerCode, presaleDate, qty, remark) {
  var v = validatePresale(key.orderNo, key.itemNo, customerCode, qty);
  if (!v.result.ok) return v.result;
  var c = v.customer;
  var record = findPresale(key);
  if (!record) return fail('找不到這筆預售紀錄');
  var keyChanged = c.code !== record.customerCode || presaleDate !== record.presaleDate;
  var delta = qty - record.qty;
  if (keyChanged && findPresale({ orderNo: key.orderNo, itemNo: key.itemNo, customerCode: c.code, presaleDate: presaleDate }))
    return fail('同一品項下、同一客戶、同一預售日已有一筆紀錄，無法改成這組內容');
  return commit(function () {
    var idx = db.presales.indexOf(record);
    if (keyChanged) {
      db.presales.splice(idx, 1);
      db.presales.push({
        orderNo: record.orderNo, itemNo: record.itemNo, customerCode: c.code, customerName: c.name, presaleDate: presaleDate,
        qty: qty, salesCode: record.salesCode, salesName: record.salesName, unitPrice: 0, remark: truncate(norm(remark), 20),
        serial2: record.serial2
      });
    } else {
      record.customerName = c.name;
      record.qty = qty;
      record.unitPrice = 0;
      record.remark = truncate(norm(remark), 20);
    }
    addToErpSoldQty(record.orderNo, record.itemNo, delta);
  });
}
function presaleDelete(key) {
  if (!isEditable(key.orderNo)) return fail('訂單編號 ' + key.orderNo + ' 目前不開放異動');
  var record = findPresale(key);
  if (!record) return fail('找不到這筆預售紀錄');
  return commit(function () {
    db.presales.splice(db.presales.indexOf(record), 1);
    addToErpSoldQty(record.orderNo, record.itemNo, -record.qty);
  });
}
/** 預售操作完成後回到來源頁 */
function presaleReturn(from, orderNo, itemNo, nav) {
  if (from === 'my') return { path: '/presales/my', params: {} };
  if (from === 'group' && nav.fromGrouped)
    return { path: '/items/detail', params: { orderNo: orderNo, grouped: 'true', airCode: nav.fromAirCode, prodCode: nav.fromProdCode } };
  return { path: '/items/detail', params: { orderNo: orderNo, itemNo: itemNo, fromGrouped: nav.fromGrouped ? 'true' : null, fromAirCode: nav.fromAirCode, fromProdCode: nav.fromProdCode } };
}
function navOf(p) {
  return { fromGrouped: p.fromGrouped === 'true', fromAirCode: p.fromAirCode || null, fromProdCode: p.fromProdCode || null };
}
function navParams(from, nav) {
  return { from: from, fromGrouped: nav.fromGrouped ? 'true' : null, fromAirCode: nav.fromAirCode, fromProdCode: nav.fromProdCode };
}
function deletePresaleAction(key, from, nav) {
  if (!window.confirm('確定要刪除這筆預售紀錄嗎？此操作無法復原。')) return;
  var r = presaleDelete(key);
  flash(r.ok ? '預售紀錄已刪除' : r.error);
  var back = presaleReturn(from, key.orderNo, key.itemNo, nav);

}

          }

    html += '<div class="empty-state"><div class="empty-icon">🔍</div><p>請設定查詢條件後按「查詢」</p></div>';
  } else if (error || !result.totalItems) {
    html += '<div class="empty-state"><div class="empty-icon">📂</div><p>沒有符合條件的商品</p></div>';
  } else {
    html += '<p class="field-hint" style="margin:0 0 10px;">符合 ' + result.orderCount + ' 張採購單，共 ' + result.groups.length + ' 組結果（' + result.totalItems + ' 個品項）' +
      (totalPages > 1 ? '（第 ' + page + ' / ' + totalPages + ' 頁）' : '') + '</p>';
    pageGroups.forEach(function (it) {
      var link = it.groupedCount > 1
        ? href('/items/detail', { orderNo: it.orderNo, airCode: it.airCode, prodCode: it.prodCode, grouped: 'true' })
        : href('/items/detail', { orderNo: it.orderNo, itemNo: it.itemNo });
      html += '<div class="card result-card">' +
        '<div class="result-order-no">訂單編號 ' + esc(it.orderNo) + '</div>' +
        '<div class="result-name-row"><div class="result-mprdno">' + esc(it.mprdNo || '—') + '</div>' +
        '<div class="result-product">' + esc(it.productName) + (it.airCode ? '　' + esc(it.airCode) : '') + '</div></div>' +
        (it.varietyNames.length ? '<div class="result-varieties">' + it.varietyNames.map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') + '</div>' : '') +
        '<div class="result-meta">實際到貨日：' + fmtDate(it.arriveDate) + '　' + esc(L.container) + '：' + esc(it.containerNo || '—') +
        (it.editable ? '' : '　<span class="badge badge-gray">唯讀</span>') + '</div>' +
        statsHtml(it, false) +
        '<div class="action-row"><a class="btn btn-sm btn-info" href="' + esc(link) + '">查詢</a></div></div>';
    });
    html += pagerHtml(page, totalPages, function (n) { return href('/items', Object.assign({ searched: 'true' }, q, { page: n })); });
  }

  return {
    title: '預售紀錄', activeNav: 'items', itemQuery: true, html: html,
    mount: function () {
      var form = document.getElementById('item-query');
      mountChoiceButtons(form);
      form.querySelector('[data-clear]').addEventListener('click', function () { lsRemove(LASTQUERY_KEY); go('/items'); });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var params = { searched: 'true' };
        ['orderNo', 'containerNo', 'startDate', 'endDate', 'productName', 'englishBrand', 'englishVariety'].forEach(function (k) { params[k] = form.elements[k].value.trim(); });
        ['unloadCountry', 'marine', 'transfer'].forEach(function (k) { var c = form.querySelector('input[name="' + k + '"]:checked'); params[k] = c ? c.value : '全部'; });
        var btn = form.querySelector('[data-loading-submit]');
        btn.disabled = true; btn.textContent = '查詢中…';
        withLoading('查詢中…', function () { go('/items', params); });
      });
    }
  };
}
function statsHtml(it, withUnit) {
  var u = withUnit ? ' ' + UNIT : '';
  return '<div class="stats-row">' +
    '<div class="stat-item"><div class="stat-label">採購' + UNIT + '數</div><div class="stat-value">' + it.purchaseQty + u + '</div></div>' +
    '<div class="stat-item"><div class="stat-label">已售量</div><div class="stat-value">' + it.soldQty + u + '</div></div>' +
    '<div class="stat-item"><div class="stat-label">差　異</div><div class="stat-value ' + (it.available > 0 ? 'positive' : 'zero') + '">' + it.available + u + '</div></div></div>';
}

/* =========================================================
   頁面：訂單詳細（單一品項或批號／品名整合列）
   ========================================================= */
function itemDetailPage(p) {
  var orderNo = p.orderNo;
  var nav = navOf(p);

    backUrl = last && last.q ? href('/items', Object.assign({ searched: 'true' }, last.q, { page: last.page })) : '#/items';
  }
  var me = currentUser();

  if (p.grouped === 'true' || p.airCode) {
    var group = airGroupDetail(orderNo, p.airCode, p.prodCode);
    if (!group) return notFoundPage();
    var s = group.summary;
    var title = s.groupedCount > 1 ? s.productName + ' ' + (s.airCode || '') : s.productName;

      '<div class="section-label detail-section-title">整合品項明細</div>';
    group.items.forEach(function (gi) {
      html += '<div class="card"><div class="card-header"><div><div class="card-title">' + esc(gi.productName) + '</div>' +
        '<div class="card-subtitle">訂單編號 ' + esc(gi.orderNo) + '　序 ' + esc(gi.itemNo) + '</div></div>' +
        '<span class="badge ' + (gi.available > 0 ? 'badge-green' : 'badge-red') + '">' + (gi.available > 0 ? '有庫存' : '無庫存') + '</span></div>' +
        statsHtml(gi, true) +
        '<div class="action-row"><a class="btn btn-sm btn-info" href="' + esc(href('/items/detail', { orderNo: gi.orderNo, itemNo: gi.itemNo, fromAirCode: s.airCode, fromProdCode: s.prodCode, fromGrouped: 'true' })) + '">查詢</a>' +
        (gi.editable ? '<a class="btn btn-sm btn-success" href="' + esc(href('/presales/create', { orderNo: gi.orderNo, itemNo: gi.itemNo, from: 'group', fromGrouped: 'true', fromAirCode: s.airCode, fromProdCode: s.prodCode })) + '">新增</a>' : '') +
        '</div></div>';
    });
    if (!s.editable) html += '<p class="field-hint" style="text-align:center;">此訂單目前為唯讀，僅開放查詢</p>';
    return { title: title, heading: title, backUrl: backUrl, html: html };
  }

  var raw = findItem(orderNo, p.itemNo);
  if (!raw) return notFoundPage();
  var item = summaryOf(raw);
  var records = presalesOf(orderNo, p.itemNo);
  var html2 = '<div class="card" style="margin-bottom:14px;"><div class="card-subtitle" style="margin:0 0 10px;">訂單編號 ' + esc(orderNo) + '　序 ' + esc(item.itemNo) + '</div>' +
    statsHtml(item, true) + '</div>';
  if (item.editable) {
    html2 += '<a class="btn btn-primary btn-block" style="margin-bottom:14px;" href="' +
      esc(href('/presales/create', { orderNo: orderNo, itemNo: item.itemNo, fromGrouped: nav.fromGrouped ? 'true' : null, fromAirCode: nav.fromAirCode, fromProdCode: nav.fromProdCode })) + '">新增預售紀錄</a>';
  }
  if (!records.length) {
    html2 += '<div class="empty-state"><div class="empty-icon">📋</div><p>尚無預售紀錄</p></div>';
  } else {
    html2 += '<div class="section-label detail-section-title">預售明細</div>';
    records.forEach(function (r, i) {
      var mine = !!me.salesCode && r.salesCode === me.salesCode;
      html2 += '<div class="card' + (mine ? ' card-mine' : '') + '"><div class="card-header"><div><div class="card-title">' + esc(r.customerName) + '</div>' +
        '<div class="card-subtitle">預售日 ' + fmtDate(r.presaleDate) + '</div></div>' +
        '<span class="badge ' + (mine ? 'badge-blue' : 'badge-gray') + '">' + r.qty + ' ' + UNIT + '</span></div>' +
        '<div class="detail-lines">業務員：<span>' + esc(r.salesName) + '</span>' + (mine ? '<span style="color:#1a73e8;font-weight:normal;">　（本人）</span>' : '') +
        (r.remark ? '\n備註：' + esc(r.remark) : '') + '</div>' +
        (item.editable
          ? '<div class="action-row" style="margin-top:12px;"><a class="btn btn-sm btn-warning" href="' +
            esc(href('/presales/edit', Object.assign({ orderNo: r.orderNo, itemNo: r.itemNo, custCode: r.customerCode, psDate: r.presaleDate }, navParams('detail', nav)))) + '">修改</a>' +
            '<button type="button" class="btn btn-sm btn-danger" data-delete-presale="' + i + '">刪除</button></div>'
          : '') + '</div>';
    });
  }
  if (!item.editable) html2 += '<p class="field-hint" style="text-align:center;">此訂單目前為唯讀，僅開放查詢</p>';

  return {
    title: item.productName, heading: item.productName, backUrl: backUrl, html: html2,
    mount: function () {
      app.querySelectorAll('[data-delete-presale]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var r = records[Number(btn.getAttribute('data-delete-presale'))];
          deletePresaleAction({ orderNo: r.orderNo, itemNo: r.itemNo, customerCode: r.customerCode, presaleDate: r.presaleDate }, 'detail', nav);
        });
      });
    }
  };
}

/* =========================================================
   頁面：新增／編輯預售紀錄
   ========================================================= */
function presaleFieldsHtml(model, item, isEdit, err) {
  return (item
    ? '<div class="info-box"><strong>' + esc(item.productName) + '</strong>訂單編號：' + esc(item.orderNo) + '　序：' + esc(item.itemNo) +
      '　廠商：' + esc(item.supplierName || '') + '<br>採購：' + item.purchaseQty + ' ' + UNIT + '　已售：' + item.soldQty + ' ' + UNIT + '　差異：' + item.available + ' ' + UNIT + '</div>'
    : '') +
    summaryHtml(err) +
    '<div class="form-group"><label for="CustomerCode">客戶代號 <span class="required">*</span></label><div class="code-row">' +
    '<input id="CustomerCode" name="customerCode" placeholder="如 C001" autocomplete="off" data-customer-code value="' + esc(model.customerCode) + '"' + errClass(err, 'customerCode') + '>' +
    '<input name="customerName" placeholder="客戶簡稱" readonly data-customer-name value="' + esc(model.customerName || '') + '"></div>' +
    '<p class="field-hint" data-customer-hint>輸入客戶代號自動帶出簡稱</p>' + fieldError(err, 'customerCode') + '</div>' +
    '<div class="form-group"><label for="PresaleDate">預售日期 <span class="required">*</span></label>' +
    '<input id="PresaleDate" name="presaleDate" type="date" value="' + esc(model.presaleDate) + '"' + errClass(err, 'presaleDate') + '>' +
    '<p class="field-hint">預設帶系統日期，可更正</p>' + fieldError(err, 'presaleDate') + '</div>' +
    '<div class="form-group"><label for="Qty">預售' + UNIT + '數 <span class="required">*</span></label>' +
    '<input id="Qty" name="qty" type="number" min="1" inputmode="numeric" placeholder="請輸入' + UNIT + '數" value="' + esc(model.qty) + '"' + errClass(err, 'qty') + '>' +
    '<p class="field-hint">不控管庫存，可超過剩餘可售量</p>' + fieldError(err, 'qty') + '</div>' +
    '<div class="form-group"><label>業務員</label>' +
    (isEdit
      ? '<input type="text" value="' + esc(model.salesDisplay) + '" readonly><p class="field-hint">建立紀錄時帶入的業務員，不可更改</p>'
      : '<input type="text" value="' + esc(model.salesDisplay) + '" readonly data-customer-sales><p class="field-hint">依客戶代號自動帶入，不可更改</p>') +
    '</div>' +
    '<div class="form-group"><label for="Remark">備註</label><textarea id="Remark" name="remark" placeholder="選填">' + esc(model.remark || '') + '</textarea></div>';
}
function readPresaleForm(form) {
  return {
    customerCode: form.elements.customerCode.value.trim(),
    customerName: form.elements.customerName.value,
    presaleDate: form.elements.presaleDate.value,
    qty: form.elements.qty.value.trim(),
    remark: form.elements.remark.value
  };
}
function validatePresaleForm(m) {
  var err = newErrors();
  if (!m.customerCode) err.fields.customerCode = '請填寫客戶代號';
  if (!isIso(m.presaleDate)) err.fields.presaleDate = '請選擇預售日期';
  if (!m.qty) err.fields.qty = '請填寫預售' + UNIT + '數';
  else if (!/^\d+$/.test(m.qty) || Number(m.qty) < 1) err.fields.qty = '請填寫有效的預售' + UNIT + '數';
  return err;
}
/** 驗證失敗時重新帶出客戶簡稱與業務員 */
function refillPresale(m, isEdit) {
  var c = customerLookup(m.customerCode);
  m.customerName = c ? c.name : '';
  if (!isEdit) m.salesDisplay = c && c.salesCode && c.salesName ? c.salesCode + '　' + c.salesName : '';
  return m;
}
function presaleCreatePage(p, model, err) {
  if (!isEditable(p.orderNo)) return deniedPage();
  var raw = findItem(p.orderNo, p.itemNo);
  if (!raw) return notFoundPage();
  var nav = navOf(p);
  var back = presaleReturn(p.from, p.orderNo, p.itemNo, nav);
  model = model || { customerCode: '', customerName: '', presaleDate: todayIso(), qty: '', remark: '', salesDisplay: '' };
  err = err || newErrors();
  return {
    title: '新增預售紀錄', heading: '新增預售紀錄', backUrl: href(back.path, back.params),
    html: '<form id="presale-form" novalidate data-customer-lookup>' + presaleFieldsHtml(model, summaryOf(raw), false, err) +
      '<button type="submit" class="btn btn-primary btn-block">確認送出</button></form>',
    mount: function () {
      var form = document.getElementById('presale-form');
      mountCustomerLookup(form);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var m = readPresaleForm(form);
        var errors = validatePresaleForm(m);
        if (!hasErrors(errors)) {
          var r = presaleCreate(p.orderNo, p.itemNo, up(m.customerCode), m.presaleDate, Number(m.qty), m.remark);
          if (r.ok) { flash('預售紀錄建立成功'); go(back.path, back.params); return; }
          errors.summary.push(r.error);
        }
        display(presaleCreatePage(p, refillPresale(m, false), errors));
      });
    }
  };
}
function presaleEditPage(p, model, err) {
  if (!isEditable(p.orderNo)) return deniedPage();
  var key = { orderNo: p.orderNo, itemNo: p.itemNo, customerCode: p.custCode, presaleDate: p.psDate };
  var record = findPresale(key);
  if (!record && !model) return notFoundPage();
  var raw = findItem(p.orderNo, p.itemNo);
  var from = p.from || 'my';
  var nav = navOf(p);
  var back = presaleReturn(from, p.orderNo, p.itemNo, nav);
  model = model || {
    customerCode: record.customerCode, customerName: record.customerName, presaleDate: record.presaleDate,
    qty: String(record.qty), remark: record.remark || '', salesDisplay: record.salesCode + '　' + record.salesName
  };
  err = err || newErrors();
  return {
    title: '編輯預售紀錄', heading: '編輯預售紀錄', backUrl: href(back.path, back.params),
    html: '<form id="presale-form" novalidate data-customer-lookup>' + presaleFieldsHtml(model, raw ? summaryOf(raw) : null, true, err) +
      '<p class="field-hint" style="margin:-6px 0 14px;">修改不限本人；變更客戶或預售日（主鍵）時，系統會刪除舊紀錄並以新鍵建立。</p>' +
      '<button type="submit" class="btn btn-primary btn-block">儲存修改</button></form>',
    mount: function () {
      var form = document.getElementById('presale-form');
      mountCustomerLookup(form);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var m = readPresaleForm(form);
        m.salesDisplay = model.salesDisplay;
        var errors = validatePresaleForm(m);
        if (!hasErrors(errors)) {
          var r = presaleUpdate(key, up(m.customerCode), m.presaleDate, Number(m.qty), m.remark);
          if (r.ok) { flash('預售紀錄已更新'); go(back.path, back.params); return; }
          errors.summary.push(r.error);
        }
        display(presaleEditPage(p, refillPresale(m, true), errors));
      });
    }
  };
}

function reasonName(code) { var r = db.reasons.filter(function (x) { return x.code === code; })[0]; return r ? r.name : null; }
function defectsOfOrder(orderNo) {
  return db.defects.filter(function (d) { return d.orderNo === orderNo; })
    .sort(function (a, b) { return cmp(a.itemNo, b.itemNo) || b.id - a.id; });
}
/** 異常回報首頁：一定要先輸入訂單編號；以前綴比對列出品項（不整合），每頁 20 筆 */
function defectIndexPage(p) {
  var orderNo = norm(p.orderNo);
  var html = '', single = null, mount = null;
  if (!orderNo) {
    html += '<p class="field-hint" style="margin:0 0 10px;">請用上方搜尋框輸入訂單編號查詢品項後回報異常（示範可輸入 DM1 或 DM1001）</p>' +
      '<div class="empty-state"><div class="empty-icon">🔍</div><p>請先輸入訂單編號查詢</p></div>';
  } else {
    var list = db.items.filter(function (i) { return up(i.orderNo).indexOf(up(orderNo)) === 0; })
      .sort(function (a, b) { return cmp(a.orderNo, b.orderNo) || cmp(a.itemNo, b.itemNo); });
    var orderSet = {};
    list.forEach(function (i) { orderSet[i.orderNo] = true; });
    var orderCount = Object.keys(orderSet).length;
    var totalPages = totalPagesOf(list.length);
    var page = clampPage(p.page, totalPages);
    var pageItems = list.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE).map(summaryOf);
    if (!list.length) {
      html += '<p class="field-hint err" style="margin:0 0 10px;">查無訂單編號 ' + esc(orderNo) + '</p>' +
        '<div class="empty-state"><div class="empty-icon">🔍</div><p>查無此訂單編號</p></div>';
    } else {
      html += '<p class="field-hint" style="margin:0 0 10px;">符合 ' + orderCount + ' 張採購單，共 ' + list.length + ' 個品項' + (totalPages > 1 ? '（第 ' + page + ' / ' + totalPages + ' 頁）' : '') + '</p>';
      if (orderCount === 1) {
        single = pageItems[0];
        html += '<div class="po-head"><div class="po-head-top"><div class="po-no">訂單編號 ' + esc(single.orderNo) + '</div>' +
          downloadBtnHtml('EXCEL', { cls: 'btn-sm po-export-btn', data: 'data-export-defect aria-label="匯出 Excel"' }) + '</div>' +
          '<div class="po-meta">廠商：' + esc(single.supplierCode) + '　' + esc(single.supplierName) + '</div></div>';
      }
      pageItems.forEach(function (it) {
        var n = db.defects.filter(function (d) { return d.orderNo === it.orderNo && d.itemNo === it.itemNo; }).length;
        html += '<div class="card"><div class="card-header"><div><div class="card-title">' + esc(it.productName) + '</div>' +
          '<div class="card-subtitle">訂單編號 ' + esc(it.orderNo) + '　序 ' + esc(it.itemNo) + '</div></div>' +
          (n > 0 ? '<span class="badge badge-red">異常 ' + n + ' 筆</span>' : '') + '</div>' +
          '<div class="action-row"><a class="btn btn-sm btn-info" href="' + esc(href('/defect/query', { orderNo: it.orderNo, itemNo: it.itemNo })) + '">查看' + (n > 0 ? '（' + n + '）' : '') + '</a>' +
          '<a class="btn btn-sm btn-warning" href="' + esc(href('/defect/create', { orderNo: it.orderNo, itemNo: it.itemNo })) + '">回報異常</a></div></div>';
      });
      html += pagerHtml(page, totalPages, function (n) { return href('/defect', { orderNo: orderNo, page: n }); });
    }
    if (single) mount = function () {
      var btn = app.querySelector('[data-export-defect]');
      btn.addEventListener('click', function () { runDownload(btn, function () { exportDefects(single.orderNo); }); });
    };
  }

/** 原因按鈕多選：維護說明第一行的【原因】標籤，保留使用者自己打的說明 */
function mountReasonButtons(scope, restore) {
  var ta = scope.querySelector('#Description');
  var selected = [];
  var prefix = function () { return selected.map(function (n) { return '【' + n + '】'; }).join('、'); };
  var buttons = scope.querySelectorAll('#reason-btns .reason-btn');
  if (restore) {
    var first = ta.value.split('\n', 1)[0];
    buttons.forEach(function (b) {
      var name = b.getAttribute('data-name');
      if (first.indexOf('【' + name + '】') >= 0) { selected.push(name); b.classList.add('active'); }
    });
  }
  function apply(old) {
    var body = ta.value;
    if (old && body.indexOf(old) === 0) {
      body = body.slice(old.length);
      if (body.charAt(0) === '\n') body = body.slice(1);
    }
    var pfx = prefix();
    ta.value = pfx ? pfx + '\n' + body : body;
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      var name = b.getAttribute('data-name'), old = prefix(), i = selected.indexOf(name);
      if (i >= 0) { selected.splice(i, 1); b.classList.remove('active'); } else { selected.push(name); b.classList.add('active'); }
      apply(old);
    });
  });
}

var MARK_TEXT_FIELDS = ['Name', 'Nation', 'Brand', 'Variety', 'Prdnm', 'Class', 'Size'];
var MARK_PROP = { Name: 'name', Nation: 'nation', Brand: 'brand', Variety: 'variety', Prdnm: 'prdnm', Class: 'cls', Size: 'size' };
function readMarkQuery(p) {
  var q = { DateFrom: isIso(p.DateFrom) ? p.DateFrom : null, DateTo: isIso(p.DateTo) ? p.DateTo : null,
    AmountMin: parseAmount(p.AmountMin), AmountMax: parseAmount(p.AmountMax), ExactMatch: p.ExactMatch === 'true' };
  if (isNaN(q.AmountMin)) q.AmountMin = null;
  if (isNaN(q.AmountMax)) q.AmountMax = null;
  MARK_TEXT_FIELDS.forEach(function (f) { q[f] = norm(p[f]); });
  // 空白進入時僅取最近 30 日，避免無條件掃描整張行情表
  var any = q.DateFrom || q.DateTo || q.AmountMin != null || q.AmountMax != null || MARK_TEXT_FIELDS.some(function (f) { return q[f]; });
  if (!any) { q.DateTo = todayIso(); q.DateFrom = addDays(q.DateTo, -29); }
  return q;
}
function markQueryParams(q) {
  var o = { DateFrom: q.DateFrom, DateTo: q.DateTo, AmountMin: q.AmountMin, AmountMax: q.AmountMax, ExactMatch: q.ExactMatch ? 'true' : null };
  MARK_TEXT_FIELDS.forEach(function (f) { o[f] = q[f]; });
  return o;
}
function queryMarks(q) {
  var list = db.marks.filter(function (m) {
    if (q.DateFrom && m.markDate < q.DateFrom) return false;
    if (q.DateTo && m.markDate > q.DateTo) return false;
    if (q.AmountMin != null && m.amount < q.AmountMin) return false;
    if (q.AmountMax != null && m.amount > q.AmountMax) return false;
    return MARK_TEXT_FIELDS.every(function (f) {
      if (!q[f]) return true;
      var v = m[MARK_PROP[f]];
      return q.ExactMatch ? v != null && up(v) === up(q[f]) : ciIncludes(v, q[f]);
    });
  });
  // 依品項群組欄位排序，讓同一品項的不同報價連續顯示
  return list.sort(function (a, b) {
    return cmp(a.nation, b.nation) || cmp(a.brand, b.brand) || cmp(a.variety, b.variety) || cmp(a.prdnm, b.prdnm) || cmp(a.cls, b.cls) ||
      -cmp(a.markDate, b.markDate) || cmp(a.compno, b.compno) || a.amount - b.amount;
  });
}

/** EXCEL1：日期＋品項欄位為一組，每組兩列（上列廠商、下列金額）；EXCEL2：每筆一列含高低金額與備註 */
function exportMarks(kind, q) {
  var records = queryMarks(q).slice(0, 10000);
  if (!records.length) { showToast('查無行情資料，無法匯出'); return; }
  var ymd = function (iso) { return iso.replace(/-/g, ''); };
  if (kind === '1') {
    var rows = [['日期', L.nation, L.markBrand, L.variety, L.product, L.cls, L.size, L.supplier + '/金額']];
    var map = {}, groups = [];
    records.forEach(function (m) {
      var key = JSON.stringify([m.markDate, m.nation, m.brand, m.variety, m.prdnm, m.cls, m.size]);
      if (!map[key]) { map[key] = []; groups.push(map[key]); }
      map[key].push(m);
    });
    groups.sort(function (a, b) {
      var x = a[0], y = b[0];
      return -cmp(x.markDate, y.markDate) || cmp(x.nation, y.nation) || cmp(x.brand, y.brand) || cmp(x.variety, y.variety) ||
        cmp(x.prdnm, y.prdnm) || cmp(x.cls, y.cls) || cmp(x.size, y.size);
    });
    groups.forEach(function (g) {
      var k = g[0];
      rows.push([ymd(k.markDate), k.nation, k.brand, k.variety, k.prdnm, k.cls, k.size].concat(g.map(function (m) { return m.name; })));
      rows.push(['', '', '', '', '', '', ''].concat(g.map(function (m) { return m.amount; })));
    });
    downloadCsv('行情表_' + stamp() + '.csv', rows);
  } else {
    var rows2 = [['日期', L.nation, L.markBrand, L.variety, L.product, L.cls, L.size, L.supplier, '低金額', '高金額', '備註', '圖片（示範版以張數表示）']];
    records.forEach(function (m) {
      rows2.push([ymd(m.markDate), m.nation, m.brand, m.variety, m.prdnm, m.cls, m.size, m.name, m.amount,
        m.highAmount == null ? '' : m.highAmount, m.remark, m.images.length ? m.images.length + ' 張' : '']);
    });
    downloadCsv('行情表2_' + stamp() + '.csv', rows2);
  }
}

/** 民國日期欄位：畫面輸入 115/10/22，實際送出原生日期欄位的西元值 */
function mountRocDates(scope) {
  scope.querySelectorAll('[data-roc-date]').forEach(function (field) {
    var text = field.querySelector('[data-roc-date-text]');
    var picker = field.querySelector('[data-roc-date-picker]');
    function displayDate() {
      var parts = picker.value.split('-');
      text.value = picker.value ? String(Number(parts[0]) - 1911).padStart(3, '0') + '/' + parts[1] + '/' + parts[2] : '';
      text.setCustomValidity('');
    }
    function syncDate() {
      var value = text.value.trim();
      text.setCustomValidity('');
      if (!value) { picker.value = ''; return; }
      var match = /^(\d{1,4})\/(\d{1,2})\/(\d{1,2})$/.exec(value);
      var year = match ? Number(match[1]) + 1911 : 0, month = match ? Number(match[2]) : 0, day = match ? Number(match[3]) : 0;
      var date = new Date(year, month - 1, day);
      if (!match || year < 1912 || year > 9999 || date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
        picker.value = '';
        text.setCustomValidity('請輸入有效的民國日期，例如 115/10/22');
        return;
      }
      picker.value = year + '-' + pad(month) + '-' + pad(day);
    }
    text.addEventListener('input', syncDate);
    text.addEventListener('blur', function () { syncDate(); if (text.validity.valid) displayDate(); });
    picker.addEventListener('change', displayDate);
    picker.addEventListener('click', function () {
      if (typeof picker.showPicker === 'function') { try { picker.showPicker(); } catch (e) { /* 不支援時保留原生行為 */ } }
    });
    displayDate();
  });
}
